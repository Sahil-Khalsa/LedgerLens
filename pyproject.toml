[project]
name = "ledgerlens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # EDGAR / HTTP
    "requests>=2.32",
    "requests-cache>=1.2",
    "ijson>=3.2",
    # Rendering
    "playwright>=1.44",
    "PyMuPDF>=1.24",
    "pillow>=10.3",
    "pytesseract>=0.3",
    # Text parsing / chunking
    "beautifulsoup4>=4.12",
    "tiktoken>=0.7",
    "lxml>=5.2",
    # Database
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    # Embeddings / ML
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "torch>=2.3",
    # Agents
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.30",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Observability
    "langfuse>=2.30",
    # Task queue (production async)
    "arq>=0.25",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "vcrpy>=6.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "types-requests>=2.32",
    "types-beautifulsoup4>=4.12",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "index", "agents", "eval", "api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ingest", "index", "agents", "eval", "api", "config"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
